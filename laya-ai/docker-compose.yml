services:
  laya:
    image: laya-serve:0.3.20
    build:
      context: .
      args:
        LAYA_VERSION: "0.3.20"
    container_name: laya-serve
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Troque pela sua chave forte: openssl rand -hex 32
      LAYA_API_KEY: "troque-esta-chave"
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_MODELS: "english,multilingual,typed-decisions"
      LAYA_AUTO_TASK: "0"
      OMP_NUM_THREADS: "4"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
